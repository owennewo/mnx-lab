<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNX Lab embed — mock host page</title>
    <style>
      /* A deliberately foreign host page: the embed must look right without
         controlling the document. Only the SMuFL face is required, served
         from wherever the host puts it. */
      @font-face {
        font-family: 'Bravura';
        src: url('/smufl/Bravura.woff2') format('woff2');
        font-display: block;
      }

      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f4efe6;
        color: #2b2620;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      .card {
        border: 1px solid #d8cfbe;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      mnx-score-viewer {
        height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A third-party page embedding MNX Lab</h1>
      <p>
        Everything inside the card is the <code>&lt;mnx-score-viewer&gt;</code> custom element,
        registered by the embed script and fed a document as a property. Shadow DOM keeps the
        styles from leaking in either direction.
      </p>
      <div class="card">
        <mnx-score-viewer compact></mnx-score-viewer>
      </div>
    </main>
    <script type="module">
      import '/src/entries/embed.ts';
      import score from '/scenarios/spec/beams/score.mnx.json';
      const viewer = document.querySelector('mnx-score-viewer');
      viewer.mnxDoc = { id: 'embed-demo', name: 'Beams', lastUpdated: 0, mnxJson: score };
    </script>
  </body>
</html>
