<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNX Lab embed — mock host page</title>
    <style>
      /* A deliberately foreign host page: the embed must look right without
         controlling the document — and, since the artifact locates its own
         assets (roadmap/proposed/core-viewer-embedded-app.md), WITHOUT
         declaring an @font-face or hosting SMuFL metadata. This page used to
         declare Bravura itself, which is precisely why the broken contract
         went unnoticed: served from the workbench origin, `/smufl` happened
         to exist. The real cross-origin check is `npm run smoke:embed`. */

      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f4efe6;
        color: #2b2620;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      .card {
        border: 1px solid #d8cfbe;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      mnx-document-viewer {
        height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A third-party page embedding MNX Lab</h1>
      <p>
        Everything inside the card is the <code>&lt;mnx-document-viewer&gt;</code> custom element,
        registered by the embed script and fed a document as a property. Shadow DOM keeps the
        styles from leaking in either direction.
      </p>
      <div class="card">
        <mnx-document-viewer compact></mnx-document-viewer>
      </div>
    </main>
    <script type="module">
      import '/src/entries/embed.ts';
      import { ContextProvider } from '@lit/context';
      import { playbackStateContext, initialPlaybackState } from '/src/elements/mnxContext.ts';
      import { linearizePasses } from '/src/model/passes.ts';
      import { inspectIteration, nextInspectionIteration, verseForIteration } from '/src/model/playback.ts';
      import { documentLyricLineIds } from '/src/engine/layout/lyricRuns.ts';
      import score from '/scenarios/spec/repeats-alternate-endings-simple/document.mnx.json';
      const viewer = document.querySelector('mnx-document-viewer');
      // The common host provides context; a sibling player cannot provide to this viewer.
      const host = document.querySelector('.card');
      let state = initialPlaybackState();
      const provider = new ContextProvider(host, { context: playbackStateContext, initialValue: state });
      provider.hostConnected(); // plain DOM has no Lit controller lifecycle
      const passes = linearizePasses(score);
      const button = document.createElement('button');
      button.textContent = 'Inspection iteration 1';
      button.addEventListener('click', () => {
        state = inspectIteration(state, nextInspectionIteration(passes, 0, state.inspectionIteration));
        provider.setValue(state);
        viewer.selectedVerse = verseForIteration(documentLyricLineIds(score), state);
        button.textContent = `Inspection iteration ${state.inspectionIteration}`;
      });
      host.prepend(button);
      viewer.mnxDoc = { id: 'embed-demo', name: 'Repeats', lastUpdated: 0, mnxJson: score };
    </script>
  </body>
</html>
